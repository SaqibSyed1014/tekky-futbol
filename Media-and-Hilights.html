<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TekkyFutbol — Media & Highlights</title>
  <link rel="icon" type="image/png" href="images/favicons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="images/favicons/favicon.svg" />
  <link rel="shortcut icon" href="images/favicons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/apple-touch-icon.png" />

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
/*       background: radial-gradient(60% 50% at 50% 35%, rgba(0, 116, 255, 0.32), rgba(0, 0, 0, 0.95) 60%), url('tekky-media-bg.jpg') center/cover no-repeat fixed; */
    }

    .hero {
      position: relative;
      z-index: 2;
      max-width: 980px;
      padding: 0 1rem
    }

    .tagline {
      margin-top: 0.4rem;
      color: var(--tekky-blue);
      font-weight: 700;
      text-shadow: 0 0 10px var(--tekky-blue);
    }

    .subtext {
      margin: 0.9rem auto 1.2rem;
      color: var(--muted);
      max-width: 70ch;
      line-height: 1.7
    }

    main {
      max-width: 1080px;
      margin: 3rem auto 4rem;
      padding: 0 1.25rem;
      text-align: center
    }

    section h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--tekky-blue);
      font-size: 2rem;
      margin-bottom: 1rem
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem
    }

    iframe {
      width: 100%;
      height: 200px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 116, 255, 0.3)
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.2rem;
      margin-top: 2rem
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 0 15px rgba(0, 116, 255, 0.25);
      transition: 0.3s
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 116, 255, 0.5)
    }

    .sec-cta {
      text-align: center;
      margin-top: 2.5rem
    }

    .nav-links.active {
      display: block;
    }

    @media(max-width:768px) {
      h1 {
        font-size: 2.5rem
      }

      header {
        min-height: 50vh
      }

      .nav-links {
        display: none
      }

      iframe {
        height: 180px
      }

      .nav-links {
        display: none;
        position: absolute;
        left: 0;
        top: 100%;
        width: 100%;
        background: #000;
        backdrop-filter: blur(10px);
      }

      .nav-links ul {
        align-items: start;
        flex-direction: column;
        padding: 20px 20px;
      }

      .nav-links .logo-desktop {
        display: none;
      }
    }
  </style>

  <link rel="stylesheet" href="styles.css" />
  <script src="components/nav.js" type="text/javascript" defer></script>
  <script src="components/footer.js" type="text/javascript" defer></script>

</head>

<body>
    <div id="nav"></div>


  <header>
    <div class="hero">
      <h1>MEDIA & HIGHLIGHTS</h1>
      <p class="tagline">For Ballers Who Create</p>
      <p class="subtext">Weekly recaps, cinematic reels, and snapshots that capture the Tekky flow.</p>
    </div>
  </header>


  <main>
  <div class="glow-divider"></div>

    <section id="videos">
      <h2>Latest Highlights</h2>
      <div class="videos">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Tekky Week 5 Recap" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Finale Party Aftermovie"
          allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Top Goals of the Month" allowfullscreen></iframe>
      </div>
    </section>

    <div class="glow-divider"></div>

    <section id="gallery">
      <h2>Photo Gallery</h2>
      <div class="gallery">
        <img src="highlight1.jpg" alt="Highlight 1">
        <img src="highlight2.jpg" alt="Highlight 2">
        <img src="highlight3.jpg" alt="Highlight 3">
        <img src="highlight4.jpg" alt="Highlight 4">
        <img src="highlight5.jpg" alt="Highlight 5">
        <img src="highlight6.jpg" alt="Highlight 6">
      </div>
    </section>

    <div class="glow-divider"></div>

    <section id="cta">
      <div class="sec-cta">
        <a class="cta" href="https://youtube.com/@TekkyFutbol" target="_blank"><i class="fab fa-youtube"></i> Watch Full
          Recaps</a>
        <a class="cta" href="https://instagram.com/tekkyfutbol" target="_blank"><i class="fab fa-instagram"></i> See
          More on Instagram</a>
        <a class="cta" href="index.html"><i class="fas fa-home"></i> Back to Home</a>
      </div>
    </section>
  </main>

   <div id="footer"></div>

</body>


</html>
