<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/svg+xml" href="images/favicons/favicon.svg" />

  <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/apple-touch-icon.png" />

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
/*       background: radial-gradient(60% 50% at 50% 35%, rgba(0, 116, 255, 0.32), rgba(0, 0, 0, 0.95) 60%), url('tekky-contact-bg.jpg') center/cover no-repeat fixed; */
    }

    .hero {
      position: relative;
      z-index: 2;
      max-width: 980px;
      padding: 0 1rem
    }


    .tagline {
      margin-top: 0.4rem;
      color: var(--tekky-blue);
      font-weight: 700;
/*       text-shadow: 0 0 10px var(--tekky-blue); */
/*       animation: pulseGlow 3s ease-in-out infinite alternate; */
    }

    .subtext {
      margin: 0.9rem auto 1.2rem;
      color: var(--muted);
      max-width: 70ch;
      line-height: 1.7
    }

    main {
      max-width: 800px;
      margin: 3rem auto 4rem;
      padding: 0 1.25rem;
      text-align: center
    }

    form#contactForm {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 2rem;
      border: 1px solid rgba(0, 116, 255, 0.3);

      box-shadow: 0 0 20px rgba(0, 116, 255, 0.15)
    }

    input,
    textarea {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 116, 255, 0.4);
      border-radius: 8px;
      padding: 0.8rem;
      color: var(--fg);
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--tekky-blue);
      box-shadow: 0 0 8px var(--tekky-blue)
    }

    textarea {
      resize: vertical;
      min-height: 120px
    }

    button.submit-btn {
      margin-top: 1rem;
      padding: 0.8rem;
      border: none;
      border-radius: 40px;
      background: var(--bg);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 0 15px var(--tekky-blue);
      transition: .25s
    }

form .cta{
      font-size: 1.1rem;
}

    button.submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px var(--tekky-blue)
    }

    .success-message {
      display: none;
      color: var(--tekky-blue);
      font-weight: 600;
      margin-top: 1rem;
      text-shadow: 0 0 8px var(--tekky-blue)
    }

    .glow-divider {
      width: 80%;
      height: 4px;
      margin: 2.5rem auto;
      background: linear-gradient(90deg, transparent, var(--tekky-blue), transparent);
      border-radius: 4px;
      box-shadow: 0 0 20px var(--tekky-blue);
    }

    section h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--tekky-blue);
      font-size: 2rem;
      margin-bottom: 1rem
    }

    .contact-info {
      margin-top: 2rem
    }

    .contact-info p {
      color: #d3d9e3;
      margin: 0.4rem 0
    }

    .sec-cta {
      text-align: center;
      margin-top: 2rem
    }


    .nav-links.active {
      display: block;
    }

    @media(max-width:768px) {
      h1 {
        font-size: 2.5rem
      }
    }
    #footer .social a{ display: none; }
    .green-check{ transition: opacity 1000 ease; }
  </style>

  <link rel="stylesheet" href="styles.css" />
  <script src="components/nav.js" type="text/javascript" defer></script>
  <script src="components/footer.js" type="text/javascript" defer></script>

</head>

<body>
    <div id="nav"></div>


  <header>
    <div class="hero">
      <h1>CONTACT TEKKYFUTBOL</h1>
      <p class="tagline">For Ballers Who Create</p>
      <p class="subtext">Reach out for sponsorships, media, or player inquiries.</p>
    </div>
  </header>


  <main>
  <div class="glow-divider"></div>

    <section id="contact-form">
      <h2>Send a Message</h2>
      <form id="contactForm">
         <input type="hidden" name="access_key" value="ef9b49eb-fc9c-495c-86bb-4f2b03096619">
         <input type="checkbox" name="botcheck" id="" style="display: none;">

        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <input type="text" name="subject" placeholder="Subject" required>
        <textarea name="message" placeholder="Your Message" required></textarea>
        <button type="submit" class="cta un-focused">Send Message</button>
        <div class="success-message"><span class="green-check">✅</span> Your message has been sent!</div>
      </form>
    </section>

    <div class="glow-divider"></div>

    <section id="contact-info" class="contact-info">
      <h2>Direct Contact</h2>
      <p><i class="fas fa-envelope"></i> tekkyfutbol@gmail.com</p>
      <p><i class="fas fa-map-marker-alt"></i> Chicago, IL (Based)</p>
      <div class="social">
        <a href="https://instagram.com/tekkyfutbol" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://x.com/TekkyFutbol" target="_blank"><i class="fab fa-x-twitter"></i></a>
      </div>
    </section>

    <div class="glow-divider"></div>

    <section id="cta">
      <div class="sec-cta">
        <a class="cta" href="registration.html">Register Your Squad</a>
        <a class="cta" href="Partners.html">View Partners</a>
        <a class="cta" href="index.html">Back to Home</a>
      </div>
    </section>
  </main>

   <div id="footer"></div>

   <script>
           const contactForm = document.getElementById('contactForm');
           const successMessage = document.querySelector('.success-message');
           const greenCheck = document.querySelector('.green-check');

           contactForm.addEventListener('submit', e => {
               e.preventDefault();


               const form = event.target;
               const submitBtn = form.querySelector('button[type="submit"]');
               const originalBtnHTML = submitBtn.innerHTML;

               submitBtn.disabled = true;
               submitBtn.innerHTML = `
                  <span class="spinner"></span>
                  Submitting
               `;

               const formData = new FormData(form);
               const object = Object.fromEntries(formData);
               const json = JSON.stringify(object);

               fetch('https://api.web3forms.com/submit', {
                   method: 'POST',
                   headers: {
                       'Content-Type': 'application/json',
                       'Accept': 'application/json'
                   },
                   body: json
               }).then(async (response) => {
                   let res = await response.json();
                   console.log('response', response);
                   if (response.status == 200) {
                       contactForm.reset();
                       successMessage.style.display = 'block';
                   } else {
                       console.log('error')
                   }
               }).catch(error => {
                   console.error("Form Error:", error);
               }).finally(() => {
                   submitBtn.disabled = false;
                   submitBtn.innerHTML = originalBtnHTML;
               });


             setTimeout(() => {
               successMessage.style.opacity = 0.6;
             }, 5000);
           });
   </script>

</body>


</html>
